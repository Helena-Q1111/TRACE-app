<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACE Visualizer - 3D Chord Embedding Explorer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Collapsible feature sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="logo">TRACE</span>
            <button class="icon-btn" id="collapseBtn" title="收起边栏">&#9664;</button>
        </div>

        <div class="sidebar-scroll">
            <!-- Transport -->
            <div class="section">
                <div class="section-title">播放 Playback</div>
                <div class="transport">
                    <button id="playBtn" title="Play">&#9654;</button>
                    <button id="pauseBtn" title="Pause">&#10073;&#10073;</button>
                    <button id="restartBtn" title="Restart">&#8634;</button>
                </div>
                <div class="control-group">
                    <button class="upload-btn" data-pick-midi>&#8682; <span id="uploadLabel">导入 MIDI</span></button>
                    <input type="file" id="midiInput" accept=".mid,.midi" hidden>
                    <!-- the two cached projects (js/projects.js) -->
                    <div class="project-chips" id="projectChips" hidden></div>
                </div>
                <div class="control-group">
                    <label class="control-label">音色 Timbre</label>
                    <div class="theme-row" id="timbreButtons">
                        <button class="theme-btn active" data-timbre="piano" title="Salamander piano samples">钢琴</button>
                        <button class="theme-btn" data-timbre="sine" title="Pure sine wave">正弦</button>
                        <button class="theme-btn" data-timbre="epiano" title="FM electric piano (Rhodes-like)">电钢</button>
                        <button class="theme-btn" data-timbre="pad" title="Detuned saw pad, lowpassed">铺底</button>
                    </div>
                </div>
                <!-- BPM hidden: timing is read from MIDI -->
                <div class="control-group" style="display: none;">
                    <label class="control-label">BPM</label>
                    <input type="range" id="bpmSlider" min="60" max="200" value="120">
                    <span id="bpmValue">120</span>
                </div>
            </div>

            <!-- Key / tonality -->
            <div class="section" id="keySection" style="display: none;">
                <div class="section-title">调性 Key</div>
                <label class="control-label">主调 Main key（自动猜测，可改）</label>
                <select id="mainKeySelect" class="key-select"></select>
                <label class="control-label">转调 Modulations</label>
                <div id="modList"></div>
                <button class="add-mod-btn" id="addModBtn">+ 在第?小节转为?调</button>
            </div>

            <!-- Appearance (collapsible, open by default: it is what the sidebar is for now) -->
            <div class="section collapsible" id="appearanceSection">
                <div class="section-title toggle" data-target="appearanceSection">
                    <span>外观 Appearance</span><span class="caret">&#9662;</span>
                </div>
                <div class="section-body">
                    <label class="control-label">1. 和弦方案 Chord scheme</label>
                    <div class="theme-row" id="chordModeButtons">
                        <button class="theme-btn" data-mode="function3">功能三色</button>
                        <button class="theme-btn active" data-mode="quality4">大小四色</button>
                    </div>

                    <label class="control-label">2. 配色方案 Palette</label>
                    <div class="swatch-row" id="paletteSwatches">
                        <button class="swatch palette-swatch active" data-palette="vividBright" title="亮·饱和"></button>
                        <button class="swatch palette-swatch" data-palette="softBright" title="亮·柔和"></button>
                        <button class="swatch palette-swatch" data-palette="vividDeep" title="暗·饱和"></button>
                    </div>

                    <label class="control-label">背景 Background</label>
                    <div class="theme-row" id="themeButtons">
                        <button class="theme-btn active" data-theme="dark">深空</button>
                        <button class="theme-btn" data-theme="light">纸白</button>
                    </div>

                    <label class="control-label">星星密度 Star density
                        <span class="value-badge" id="densityValue">100%</span>
                    </label>
                    <input type="range" id="densitySlider" min="5" max="100" value="100">

                    <label class="control-label">线条粗细 Line width
                        <span class="value-badge" id="lineWidthValue">1.0x</span>
                    </label>
                    <input type="range" id="lineWidthSlider" min="10" max="100" value="50">

                    <label class="control-label">轨迹淡出 Fade after (bars)
                        <span class="value-badge" id="fadeValue">16</span>
                    </label>
                    <input type="range" id="fadeSlider" min="4" max="50" value="16">

                    <label class="control-label">空间参照 Spatial anchors</label>
                    <div class="theme-row" id="anchorButtons">
                        <button class="theme-btn active" data-anchor="on">显示</button>
                        <button class="theme-btn" data-anchor="off">隐藏</button>
                    </div>

                    <label class="control-label">自编码器面板 Autoencoder panel</label>
                    <div class="theme-row" id="aePanelButtons">
                        <button class="theme-btn active" data-ae="on">显示</button>
                        <button class="theme-btn" data-ae="off">隐藏</button>
                    </div>
                </div>
            </div>

            <!-- Future features (collapsible) -->
            <div class="section section-future collapsible folded" id="moreSection">
                <div class="section-title toggle" data-target="moreSection">
                    <span>更多 More</span><span class="caret">&#9662;</span>
                </div>
                <div class="section-body">
                    <button class="theme-btn export-btn" id="exportBtn">导出视频</button>
                    <div class="future-item">和声分析 <span class="soon">soon</span></div>
                    <div class="future-item">多轨可视化 <span class="soon">soon</span></div>
                </div>
            </div>
        </div>

        <div class="resize-handle" id="resizeHandle"></div>
    </div>

    <button class="icon-btn expand-btn" id="expandBtn" title="展开边栏" hidden>&#9654;</button>

    <div id="canvas">
        <!-- Heads-up anchors: landmark labels, off-screen chevrons, boundary ticks -->
        <canvas id="anchorCanvas" class="anchor-hud"></canvas>

        <!-- Start prompt: shown until a MIDI is open (js/projects.js) -->
        <div class="start-prompt" id="startPrompt">
            <div class="start-card">
                <div class="start-icon">&#9835;</div>
                <div class="start-title">导入一首 MIDI 开始</div>
                <div class="start-sub">把 .mid 文件拖到这里，或者</div>
                <button class="start-btn" data-pick-midi>选择 MIDI 文件</button>
                <div class="start-recent-wrap" hidden>
                    <div class="start-sub">最近的工程</div>
                    <div class="start-recent" id="startRecent"></div>
                </div>
            </div>
        </div>

        <!-- Experimental view layouts (js/views.js) -->
        <div class="view-bar" id="viewBar">
            <button data-view="original" class="active" title="原来的视图：跟随和弦飞行">原始</button>
            <button data-view="bowl" title="学到的空间：以 I 为中心摆正，不做变形">张力碗</button>
            <button data-view="well" title="规整化：五度圈均匀分布，离 I 的距离保持真实">引力井</button>
            <button data-view="tunnel" title="引力井的截面沿时间展开">隧道</button>
            <label class="view-morph" id="viewMorphWrap" hidden>学到的
                <input type="range" id="viewMorph" min="0" max="100" value="0">规整</label>
            <button id="viewTop" hidden title="俯视：引力井从上往下看就是 2D 靶盘">俯视</button>
        </div>

        <!-- The move just made: which chord to which, what TPS says it costs
             (delta = i + j + k), how each chord tone travelled, and where the
             piece stands relative to home. Recent moves stack underneath and
             fade out. Hidden until a MIDI is loaded. -->
        <div class="move-panel" id="movePanel" hidden>
            <div class="mv-head">
                <span class="mv-title">MOVE</span>
                <span class="mv-where" id="mvWhere"></span>
            </div>
            <div class="mv-chords">
                <span class="mv-chord mv-from" id="mvFrom"><i class="mv-dot"></i><b></b></span>
                <span class="mv-arrow">&rarr;</span>
                <span class="mv-chord mv-to" id="mvTo"><i class="mv-dot"></i><b></b></span>
            </div>

            <div class="mv-eq" id="mvEq">
                <span class="mv-term mv-d"><em>&delta;</em><b id="mvDelta"></b></span>
                <span class="mv-op">=</span>
                <span class="mv-term t-i"><em>i</em><b id="mvI"></b><small>key</small></span>
                <span class="mv-op">+</span>
                <span class="mv-term t-j"><em>j</em><b id="mvJ"></b><small>root 5ths</small></span>
                <span class="mv-op">+</span>
                <span class="mv-term t-k"><em>k</em><b id="mvK"></b><small>tones</small></span>
            </div>
            <div class="mv-stack" id="mvStack">
                <span class="t-i"></span><span class="t-j"></span><span class="t-k"></span>
            </div>
            <div class="mv-model">&Vert;&Delta;z&Vert; model <b id="mvDz"></b></div>

            <div class="mv-sub">chord tones <span id="mvVoiceNote"></span></div>
            <canvas class="mv-canvas" id="mvVoices"></canvas>

            <div class="mv-sub">from I <span id="mvHome"></span></div>
            <canvas class="mv-canvas mv-arc" id="mvArc" title="Click to jump to a chord"></canvas>

            <div class="mv-history" id="mvHistory"></div>
        </div>
    </div>

    <div class="circle-fifths">
        <canvas id="circleCanvas" width="200" height="200"></canvas>
    </div>

    <!-- Autoencoder panel: how the current chord's 3D coordinate is computed -->
    <div class="ae-panel" id="aePanel">
        <canvas id="aeCanvas"></canvas>
    </div>

    <!-- Vendored libraries (offline-capable) -->
    <script src="vendor/three.min.js"></script>
    <script src="vendor/CopyShader.js"></script>
    <script src="vendor/LuminosityHighPassShader.js"></script>
    <script src="vendor/EffectComposer.js"></script>
    <script src="vendor/RenderPass.js"></script>
    <script src="vendor/ShaderPass.js"></script>
    <script src="vendor/UnrealBloomPass.js"></script>
    <script src="vendor/tween.umd.js"></script>
    <script src="vendor/Tone.js"></script>
    <script src="vendor/midi-parser.min.js"></script>

    <!-- App modules (load order matters) -->
    <script src="js/config.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/cosmos.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/analysis.js"></script>
    <script src="js/chords.js"></script>
    <script src="js/landmarks.js"></script>
    <script src="js/views.js"></script>
    <script src="js/playback.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/projects.js"></script>
    <script src="js/radar.js"></script>
    <script src="js/aeviz.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
