<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACE Visualizer - 3D Chord Embedding Explorer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Collapsible feature sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="logo">TRACE</span>
            <button class="icon-btn" id="collapseBtn" title="收起边栏">&#9664;</button>
        </div>

        <div class="sidebar-scroll">
            <!-- Transport -->
            <div class="section">
                <div class="section-title">播放 Playback</div>
                <div class="transport">
                    <button id="playBtn" title="Play">&#9654;</button>
                    <button id="pauseBtn" title="Pause">&#10073;&#10073;</button>
                    <button id="restartBtn" title="Restart">&#8634;</button>
                </div>
                <div class="control-group">
                    <label class="control-label">导入 MIDI (.mid)</label>
                    <input type="file" id="midiInput" accept=".mid,.midi">
                </div>
                <!-- BPM hidden: timing is read from MIDI -->
                <div class="control-group" style="display: none;">
                    <label class="control-label">BPM</label>
                    <input type="range" id="bpmSlider" min="60" max="200" value="120">
                    <span id="bpmValue">120</span>
                </div>
            </div>

            <!-- Key / tonality -->
            <div class="section" id="keySection" style="display: none;">
                <div class="section-title">调性 Key</div>
                <label class="control-label">主调 Main key（自动猜测，可改）</label>
                <select id="mainKeySelect" class="key-select"></select>
                <label class="control-label">转调 Modulations</label>
                <div id="modList"></div>
                <button class="add-mod-btn" id="addModBtn">+ 在第?小节转为?调</button>
            </div>

            <!-- Chord list + live metrics -->
            <div class="section section-grow">
                <div class="section-title">和弦 Chords</div>
                <div class="metrics-box">
                    <div class="metric">
                        <span class="metric-label">d</span>
                        <span class="metric-value" id="liveD">&mdash;</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">t</span>
                        <span class="metric-value" id="liveT">&mdash;</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">级数</span>
                        <span class="metric-value" id="liveDegree">&mdash;</span>
                    </div>
                </div>
                <div class="chord-list" id="chordList"></div>
            </div>

            <!-- Appearance (collapsible) -->
            <div class="section collapsible folded" id="appearanceSection">
                <div class="section-title toggle" data-target="appearanceSection">
                    <span>外观 Appearance</span><span class="caret">&#9662;</span>
                </div>
                <div class="section-body">
                    <label class="control-label">1. 和弦方案 Chord scheme</label>
                    <div class="theme-row" id="chordModeButtons">
                        <button class="theme-btn" data-mode="function3">功能三色</button>
                        <button class="theme-btn active" data-mode="quality4">大小四色</button>
                    </div>

                    <label class="control-label">2. 配色方案 Palette</label>
                    <div class="swatch-row" id="paletteSwatches">
                        <button class="swatch palette-swatch active" data-palette="vividBright" title="亮·饱和"></button>
                        <button class="swatch palette-swatch" data-palette="softBright" title="亮·柔和"></button>
                        <button class="swatch palette-swatch" data-palette="vividDeep" title="暗·饱和"></button>
                    </div>

                    <label class="control-label">背景 Background</label>
                    <div class="theme-row" id="themeButtons">
                        <button class="theme-btn active" data-theme="dark">深空</button>
                        <button class="theme-btn" data-theme="light">纸白</button>
                    </div>

                    <label class="control-label">星星密度 Star density
                        <span class="value-badge" id="densityValue">100%</span>
                    </label>
                    <input type="range" id="densitySlider" min="5" max="100" value="100">

                    <label class="control-label">线条粗细 Line width
                        <span class="value-badge" id="lineWidthValue">1.0x</span>
                    </label>
                    <input type="range" id="lineWidthSlider" min="10" max="100" value="50">

                    <label class="control-label">轨迹淡出 Fade after (bars)
                        <span class="value-badge" id="fadeValue">16</span>
                    </label>
                    <input type="range" id="fadeSlider" min="4" max="50" value="16">
                </div>
            </div>

            <!-- Future features (collapsible) -->
            <div class="section section-future collapsible folded" id="moreSection">
                <div class="section-title toggle" data-target="moreSection">
                    <span>更多 More</span><span class="caret">&#9662;</span>
                </div>
                <div class="section-body">
                    <button class="theme-btn export-btn" id="exportBtn">导出视频（当前视角为起点，跟随录制整曲）</button>
                    <div class="export-hint">先拖动/缩放摆好起始视角，点击后从第1小节播放并录制（镜头继续正常跟随），一遍结束自动保存 MP4（不支持时回退 WebM）</div>
                    <div class="future-item">和声分析 <span class="soon">soon</span></div>
                    <div class="future-item">多轨可视化 <span class="soon">soon</span></div>
                </div>
            </div>
        </div>

        <div class="resize-handle" id="resizeHandle"></div>
    </div>

    <button class="icon-btn expand-btn" id="expandBtn" title="展开边栏" hidden>&#9654;</button>

    <div id="canvas"></div>

    <div class="circle-fifths">
        <canvas id="circleCanvas" width="200" height="200"></canvas>
    </div>

    <!-- Vendored libraries (offline-capable) -->
    <script src="vendor/three.min.js"></script>
    <script src="vendor/CopyShader.js"></script>
    <script src="vendor/LuminosityHighPassShader.js"></script>
    <script src="vendor/EffectComposer.js"></script>
    <script src="vendor/RenderPass.js"></script>
    <script src="vendor/ShaderPass.js"></script>
    <script src="vendor/UnrealBloomPass.js"></script>
    <script src="vendor/tween.umd.js"></script>
    <script src="vendor/Tone.js"></script>
    <script src="vendor/midi-parser.min.js"></script>

    <!-- App modules (load order matters) -->
    <script src="js/config.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/cosmos.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/analysis.js"></script>
    <script src="js/chords.js"></script>
    <script src="js/playback.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
